<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Progress</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

  <div class="container py-5">
    <div class="row g-4 justify-content-center">

      <!-- Skill 1 -->
      <div class="col-md-3 col-sm-6 text-center">
        <div class="progress-circle" data-progress="90">
          <img src="figma.png" alt="Figma" class="skill-logo">
        </div>
        <h5 class="mt-3 text-warning fw-bold">90%</h5>
        <p class="text-light">Figma</p>
      </div>

      <!-- Skill 2 -->
      <div class="col-md-3 col-sm-6 text-center">
        <div class="progress-circle" data-progress="75">
          <img src="html.png" alt="HTML" class="skill-logo">
        </div>
        <h5 class="mt-3 text-warning fw-bold">75%</h5>
        <p class="text-light">HTML</p>
      </div>

      <!-- Skill 3 -->
      <div class="col-md-3 col-sm-6 text-center">
        <div class="progress-circle" data-progress="60">
          <img src="css.png" alt="CSS" class="skill-logo">
        </div>
        <h5 class="mt-3 text-warning fw-bold">60%</h5>
        <p class="text-light">CSS</p>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
