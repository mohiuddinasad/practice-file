<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Progress Bar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="skills-section">
    <div class="skills-container">
      <div class="skills">
        <h2>Design Skill</h2>
        <div class="skill">
          <p>Photoshop <span>100%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="100"></div></div>
        </div>
        <div class="skill">
          <p>Figma <span>95%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="95"></div></div>
        </div>
        <div class="skill">
          <p>Adobe XD <span>60%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="60"></div></div>
        </div>
        <div class="skill">
          <p>Adobe Illustrator <span>70%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="70"></div></div>
        </div>
        <div class="skill">
          <p>Design <span>90%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="90"></div></div>
        </div>
      </div>

      <div class="skills">
        <h2>Development Skill</h2>
        <div class="skill">
          <p>HTML <span>85%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="85"></div></div>
        </div>
        <div class="skill">
          <p>CSS <span>80%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="80"></div></div>
        </div>
        <div class="skill">
          <p>JavaScript <span>90%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="90"></div></div>
        </div>
        <div class="skill">
          <p>Software <span>75%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="75"></div></div>
        </div>
        <div class="skill">
          <p>Plugin <span>70%</span></p>
          <div class="progress-bar"><div class="progress" data-progress="70"></div></div>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
