<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Home</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h2>MyShop</h2>
    <div class="cart-icon" id="cartToggleDesktop">
      🛒 <span id="cartCountDesktop">0</span> | <span id="cartSubtotalNav">$0.00</span>
    </div>
  </nav>

  <!-- Products -->
  <section class="products">
    <div class="product" data-id="1" data-name="Green Capsicum" data-price="14"
      data-img="https://via.placeholder.com/80">
      <img src="https://via.placeholder.com/80" alt="">
      <h4>Green capsicum</h4>
      <p>$14.00</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>
    <div class="product" data-id="2" data-name="Red Capsicum" data-price="14"
      data-img="https://via.placeholder.com/80/FF0000">
      <img src="https://via.placeholder.com/80/FF0000" alt="">
      <h4>Red Capsicum</h4>
      <p>$14.00</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>
  </section>

  <!-- Sidebar Cart -->
  <div id="cartSidebar" class="sidebar">
    <div class="sidebar-header">
      <h3>Shopping Cart (<span id="item_number">0</span> items)</h3>
      <button id="closeCart">✖</button>
    </div>
    <div id="cartItems"></div>
    <div class="sidebar-footer">
      <p>Subtotal: <span id="cartSubtotal">$0.00</span></p>
      <button id="clearCart">Clear All</button>
      <a href="cart.html" class="btn">Go to Cart</a>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>

</html>
