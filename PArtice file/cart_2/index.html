<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shop - Products</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">MyShop</div>
    <div class="header-icons">
      <div class="icon" id="wishlist-icon">
        <a href="wishlist.html" class="link-no-style">💖</a>
        <span class="badge" id="wishlist-count">0</span>
      </div>

      <div class="icon" id="cart-icon" onclick="toggleCart()">
        🛒
        <span class="badge" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <h1>Products</h1>

    <div class="products-grid" id="products-grid">
      <!-- Product cards (sample products) -->
      <div class="product-card" data-id="1" data-name="Fresh Indian Orange" data-price="12.00">
        <img src="https://via.placeholder.com/120x90.png?text=Orange" alt="Orange" />
        <div class="p-info">
          <h3>Fresh Indian Orange</h3>
          <p class="price">$12.00</p>
        </div>
        <div class="p-actions">
          <button class="btn btn-cart" onclick="addToCartFromBtn(1)">Add to Cart</button>
          <button class="btn btn-wish" onclick="addToWishlistFromBtn(1)">Add to Wishlist</button>
        </div>
      </div>

      <div class="product-card" data-id="2" data-name="Green Apple" data-price="14.00">
        <img src="https://via.placeholder.com/120x90.png?text=Apple" alt="Apple" />
        <div class="p-info">
          <h3>Green Apple</h3>
          <p class="price">$14.00</p>
        </div>
        <div class="p-actions">
          <button class="btn btn-cart" onclick="addToCartFromBtn(2)">Add to Cart</button>
          <button class="btn btn-wish" onclick="addToWishlistFromBtn(2)">Add to Wishlist</button>
        </div>
      </div>

      <div class="product-card" data-id="3" data-name="Chinese Cabbage" data-price="45.00">
        <img src="https://via.placeholder.com/120x90.png?text=Cabbage" alt="Cabbage" />
        <div class="p-info">
          <h3>Chinese Cabbage</h3>
          <p class="price">$45.00</p>
        </div>
        <div class="p-actions">
          <button class="btn btn-cart" onclick="addToCartFromBtn(3)">Add to Cart</button>
          <button class="btn btn-wish" onclick="addToWishlistFromBtn(3)">Add to Wishlist</button>
        </div>
      </div>

      <div class="product-card" data-id="4" data-name="Fresh Sujapuri Mango" data-price="9.00">
        <img src="https://via.placeholder.com/120x90.png?text=Mango" alt="Mango" />
        <div class="p-info">
          <h3>Fresh Sujapuri Mango</h3>
          <p class="price">$9.00</p>
        </div>
        <div class="p-actions">
          <button class="btn btn-cart" onclick="addToCartFromBtn(4)">Add to Cart</button>
          <button class="btn btn-wish" onclick="addToWishlistFromBtn(4)">Add to Wishlist</button>
        </div>
      </div>

    </div>
  </main>

  <!-- CART SIDEBAR -->
  <aside id="cart-bar" class="cart-bar" aria-hidden="true">
    <div class="cart-head">
      <h3>Shopping Cart <small id="cart-items-count-text"></small></h3>
      <button class="close-sidebar" onclick="toggleCart()">✖</button>
    </div>

    <ul id="cart-items-list" class="cart-items-list">
      <!-- items populated by JS -->
    </ul>

    <div class="cart-footer">
      <div class="cart-summary">
        <span id="cart-summary-count">0 Items</span>
        <span id="cart-summary-total">$0.00</span>
      </div>
      <a href="cart.html" class="btn btn-checkout">Go To Cart</a>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
