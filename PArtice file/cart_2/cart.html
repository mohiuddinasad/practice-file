<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Shopping Cart</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">MyShop</div>
    <div class="header-icons">
      <div class="icon" id="wishlist-icon-top">
        <a href="wishlist.html" class="link-no-style">💖</a>
        <span class="badge" id="wishlist-count-2">0</span>
      </div>

      <div class="icon" id="cart-icon-top" onclick="toggleCart()">
        🛒
        <span class="badge" id="cart-count-2">0</span>
      </div>
    </div>
  </header>

  <main class="container cart-page">
    <h1>My Shopping Cart</h1>

    <div class="cart-page-grid">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th> </th>
          </tr>
        </thead>
        <tbody id="cart-page-body">
          <!-- filled by JS -->
        </tbody>
      </table>

      <aside class="cart-summary-box">
        <h3>Cart Total</h3>
        <div class="summary-row"><span>Subtotal:</span> <span id="summary-sub">$0.00</span></div>
        <div class="summary-row"><span>Shipping:</span> <span>Free</span></div>
        <div class="summary-row total"><span>Total:</span> <span id="summary-total">$0.00</span></div>
        <button class="btn btn-checkout" onclick="checkoutAlert()">Proceed to checkout</button>
      </aside>
    </div>

    <div style="margin-top:20px">
      <a href="index.html" class="btn btn-light">Return to shop</a>
    </div>
  </main>

  <!-- cart sidebar also available here -->
  <aside id="cart-bar" class="cart-bar" aria-hidden="true">
    <div class="cart-head">
      <h3>Shopping Cart <small id="cart-items-count-text-2"></small></h3>
      <button class="close-sidebar" onclick="toggleCart()">✖</button>
    </div>

    <ul id="cart-items-list-2" class="cart-items-list">
      <!-- items populated by JS -->
    </ul>

    <div class="cart-footer">
      <div class="cart-summary">
        <span id="cart-summary-count-2">0 Items</span>
        <span id="cart-summary-total-2">$0.00</span>
      </div>
      <a href="cart.html" class="btn btn-checkout">Go To Cart</a>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
